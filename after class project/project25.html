<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bank App UI</title>
</head>
<body style="font-family: Arial; background-color:#f5f7fa; margin:0; padding:0;">

  <div style="width:400px; margin:40px auto; background:white; border-radius:15px; box-shadow:0 0 10px rgba(0,0,0,0.2); padding:20px;">

    <h2 style="text-align:center; color:#3b3b98;">💳 Bank App</h2>

    <!-- Credit Section -->
    <div style="background-color:#d4f8e8; border-radius:10px; padding:15px; margin-bottom:20px;">
      <h3 style="color:#218c74;">Credit (Income)</h3>
      <label style="display:block; margin-bottom:5px;">Amount:</label>
      <input type="number" style="width:100%; padding:8px; border:1px solid #ccc; border-radius:8px;">
      <label style="display:block; margin-top:10px; margin-bottom:5px;">Description:</label>
      <input type="text" style="width:100%; padding:8px; border:1px solid #ccc; border-radius:8px;">
      <button style="margin-top:10px; width:100%; background-color:#218c74; color:white; padding:10px; border:none; border-radius:8px; cursor:pointer;">Add Credit</button>
    </div>

    <!-- Debit Section -->
    <div style="background-color:#ffe6e6; border-radius:10px; padding:15px;">
      <h3 style="color:#b33939;">Debit (Expense)</h3>
      <label style="display:block; margin-bottom:5px;">Amount:</label>
      <input type="number" style="width:100%; padding:8px; border:1px solid #ccc; border-radius:8px;">
      <label style="display:block; margin-top:10px; margin-bottom:5px;">Description:</label>
      <input type="text" style="width:100%; padding:8px; border:1px solid #ccc; border-radius:8px;">
      <button style="margin-top:10px; width:100%; background-color:#b33939; color:white; padding:10px; border:none; border-radius:8px; cursor:pointer;">Add Debit</button>
    </div>

  </div>

</body>
</html>
