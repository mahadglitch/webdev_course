<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CSS Positioning Example</title>
  <style>
    .box {
      width: 150px;
      height: 150px;
      color: white;
      text-align: center;
      line-height: 150px;
      font-weight: bold;
    }

    .static-box {
      position: static;
      background-color: gray;
    }

    .relative-box {
      position: relative;
      top: 20px;
      left: 20px;
      background-color: royalblue;
    }

    .absolute-box {
      position: absolute;
      top: 10px;
      left: 200px;
      background-color: crimson;
    }

    .fixed-box {
      position: fixed;
      top: 10px;
      right: 10px;
      background-color: green;
    }

    .container {
      position: relative;
      height: 300px;
      border: 2px dashed black;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <div class="box static-box">Static</div>
  <div class="box relative-box">Relative</div>

  <div class="container">
    <div class="box absolute-box">Absolute</div>
  </div>

  <div class="box fixed-box">Fixed</div>

</body>
</html>
