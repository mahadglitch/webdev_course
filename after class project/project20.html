<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity 2</title>
</head>
<body>
    <h2>
        Age Validation
    </h2>
    <form name="ageform" onsubmit="return validateAge()">
        Age : <input name="age" type="number">
        <input type="submit" value="Submit">
        <p id="message"></p>
    </form>
    <script>
        function validateAge(){
            var age = document.forms["ageform"]["age"].value;

            if(age == ""){
                document.getElementById("message").innerText = "Please enter your age!";
                return false;
            }
            if(age < 18){
                document.getElementById("message").innerText = "You must be at least 18 years old!";
                return false;
            }
            document.getElementById("message").innerText = "Age accepted ✅";
            return false;
        }
    </script>
</body>
</html>
