
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project While Loops</title>
</head>
<body>
  <h1>
    <u>
    JavaScript While Loops Project
    </u>
  </h1>
  <p id="number"></p>
  <script>
        var text  = ""

        var i = 0

        while(i < 201){
            text = text + "<br>" + i
            i++
        }
        document.getElementById("number").innerHTML = text

        var name = "Codingal";
    alert("Hello " + name);
    </script>
</body>
</html>
