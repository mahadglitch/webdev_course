<html lang="en">
<head>

    <title>Document</title>
</head>
<body>
    <h1 id="myH"></h1>
    <p id="myP"></p>
    <h1>JavaScript Variables</h1>
    <p><u>Sum Of Two Numbers</u></p>
    <p id="result"></p>

        var num1 = 10;

        //My Heading:

        //My Paragraph:
        document.getElementById("myP").innerHTML = "My First Paragraph.";
    
    </script>
