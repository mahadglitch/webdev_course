<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity 2</title>
</head>
<body>
    <h2>Mapping Of An Array</h2>
    <p id="result"></p>
    <script>
        var numbers = [ 28 , 6 , 19 , 95 ]
        function myfunction(num){
            return num*10
        }
        var new_array = numbers.map(myfunction)
        document.getElementById("result").innerHTML = new_array
    </script>
</body>
</html>
