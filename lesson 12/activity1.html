<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=\, initial-scale=1.0">
    <title>Activity 1</title>
</head>
<body>
    <h2>
        Possitioning
    </h2>
    <div>
       Div with no possition propperty
    </div>
    <div class="sticky">
        div with stick possition propperty
    </div>
    <div class="relative">
      div with relative possition propperty
      <div class="absolute">
        div with absolute possition propperty
      </div>
    </div>
    <div class="fixed">
     div with fixed possition propperty
    </div>
    <style>
        div{
            right:30px;
            border:3px solid #73AD21;

        }
        div.absolute{
            position: absolute;
            left:50px;
            border: 3px solid blue;
        }
        div.relative{
          position: relative;
          left:100px;
          border:3px solid #73AD21;
        }
        div.fixed{
            position: fixed;
            top: 0;
            right: 20px;
            width:300px;
            border:3px solid #73AD21;
        }
        div.sticky{
            position: sticky;
            top: 1px;
            left:20px;
            width: 100px;
            border:3px solid #73AD21;
        }
    </style>
</body>
</html>
