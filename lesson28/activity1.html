<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity 1</title>
</head>
<body>
    <h2>JavaScript String Method</h2>
    <p id="number"></p>
    <p id="string"></p>
    <script>
        var x = 70
        var y = 90
        document.getElementById("number").innerHTML = x + y
        document.getElementById("string").innerHTML = String( x ) + String( y )
    </script>
</body>
</html>
