<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>activity3</title>
</head>
<body>
    <div>
        Hi!
    </div>
    <style>
    div{
        width:100px;
        background-color: red;
        height: 100px;
        animation-name: box;
        animation-duration: 4s;
    }
    @keyframes box{
        0% {
            background-color: red;
            
        }
        25% {
            background-color: yellow;
        }
        50% {
            background-color: blue;
        }
        100% {
            background-color: green;
        }
    }
    </style>
</body>
</html>
