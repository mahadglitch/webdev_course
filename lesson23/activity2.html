<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity 2</title>
</head>
<body>
    <p id="join"></p>
    <p id="pop"></p>
    <script>
        var fruites = [ 'Mango' , 'Orange' , 'Watermelon' , 'Grapes']
        document.getElementById('join').innerHTML = fruites.join ( "_" )
        document.getElementById('pop').innerHTML = fruites.pop()
    </script>
</body>
</html>
