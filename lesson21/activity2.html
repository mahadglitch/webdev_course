<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity 2</title>
</head>
<body>
    <h2>
        Loops In JavaScript
    </h2>
    <p id="demo"></p>
    <script>
        var fruites = ["Apples","Oranges","Bananas","Watermelon","Grapes"]
        var text = ""
        var i
        for(i=0;i<fruites.length;i++){
            text=text+fruites[i]+"<br>"
        }
        document.getElementById("demo").innerHTML=text
    </script>
</body>
</html>
