<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity 3</title>
</head>
<body>
    <h2>JavaScript Promise</h2>
    <p id="result"></p>
    <script>
        function mydisplay(some){
            document.getElementById("result").innerHTML = some
        }
        function sum(a,b){
            var s = a + b
            mydisplay (s)
            }
            var mypromise = new Promise(function(myResolve , myReject){
                var x = 0
                if(x==0){
                    myResolve("ok")
                }
                else{
                    myReject("error")
                }
            })
            mypromise.then(function(value){
                sum( 5 , 5 )
            },function(error){
                sum(error)
            })
    </script>
</body>
</html>
